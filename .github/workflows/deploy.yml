name: Optimized Instant Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Force the runner to do an explicit checkout with native LFS handling turned ON
      - name: Checkout Code & LFS Assets
        uses: actions/checkout@v4
        with:
          lfs: true 
          token: ${{ secrets.GITHUB_TOKEN }}

      # 2. Hard override: Ensure Git LFS checks out the binary data manually in the workspace
      - name: Force LFS Download
        run: |
          git lfs install
          git lfs pull

      # 3. Set up Pages framework environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. Pack and Deploy the real code + full binary
      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4