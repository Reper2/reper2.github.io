name: Optimized Instant Deploy to GitHub Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true # ⚡ Cancels older builds if you push rapidly

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Light checkout: Grab only the text code FIRST (bypassing LFS payload)
      - name: Checkout Code Only
        uses: actions/checkout@v4
        with:
          lfs: false 

      # 2. Check if the music zip is already cached from a previous build
      - name: Cache Large Music Archive
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music.zip
          key: ${{ runner.os }}-music-zip-${{ hashFiles('assets/music.zip') }}

      # 3. ONLY pull down the 1.15GB asset from LFS if it actually changed
      - name: Fetch LFS Assets On Cache Miss
        if: steps.cache-music.outputs.cache-hit != 'true'
        run: |
          git lfs install
          git lfs pull

      # 4. Set up Pages framework environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 5. Pack and Deploy
      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4