name: Optimized Instant Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if your branch is named master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Fast, instant download of your text code repository
      - name: Checkout Source Code
        uses: actions/checkout@v4

      # 2. Extract the real music payload out of GitHub Releases straight into the build folder
      - name: Inject Production Assets from Release
        run: |
          rm -f assets/music.zip
          curl -L -o assets/music.zip "https://github.com/${{ github.repository }}/releases/expanded_assets/music-zip/music.zip"

      # 3. Provision the deployment configuration environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 4. Deliver the real site package to your live web domain URL
      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4