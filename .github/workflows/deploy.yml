name: Optimized Instant Deploy to GitHub Pages

on:
  push:
    branches: ["main"] # Double-check if yours is main or master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Code (Pass the system token so it can talk to LFS servers)
      - name: Checkout Code Only
        uses: actions/checkout@v4
        with:
          lfs: false 
          token: ${{ secrets.GITHUB_TOKEN }} # 🔑 ADD THIS LINE

      # 2. Check if the music zip is already cached
      - name: Cache Large Music Archive
        id: cache-music
        uses: actions/cache@v4
        with:
          path: assets/music.zip
          key: ${{ runner.os }}-music-zip-${{ hashFiles('assets/music.zip') }}

      # 3. Explicitly pull the real LFS file down if it's a cache miss
      - name: Fetch LFS Assets On Cache Miss
        if: steps.cache-music.outputs.cache-hit != 'true'
        run: |
          git lfs install
          git lfs fetch --all # 🔑 CHANGED THIS FROM 'pull' TO 'fetch --all'
          git lfs checkout

      # 4. Set up Pages framework environment
      - name: Setup Pages
        uses: actions/configure-pages@v4

      # 5. Pack and Deploy
      - name: Upload Website Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4